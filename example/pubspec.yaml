name: cloudflare_realtime_example
description: "Example app for the cloudflare_realtime package."
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  clock: ^1.1.1
  cloudflare_realtime:
    path: ../
  flutter:
    sdk: flutter
  flutter_webrtc: ^1.6.2
  web_socket_channel: ^3.0.3

dev_dependencies:
  fake_async: ^1.3.3
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  # microphone_capture_test.dart reads flutter_webrtc's native log.
  logger: ^2.8.0
  stream_channel: ^2.1.4
  web: ^1.1.0

flutter:
  uses-material-design: true
  assets:
    # The caller's picture for Simulate incoming call (lib/sample_caller_image.dart).
    - assets/sample_caller.png
