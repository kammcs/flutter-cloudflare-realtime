name: cloudflare_realtime
description: "Unofficial Flutter client for the Cloudflare Realtime SFU: calls, rooms, simulcast, screen share and data channels, built on flutter_webrtc."
version: 0.0.1
repository: https://github.com/kammcs/flutter-cloudflare-realtime
issue_tracker: https://github.com/kammcs/flutter-cloudflare-realtime/issues
documentation: https://github.com/kammcs/flutter-cloudflare-realtime/tree/main/doc
topics:
  - webrtc
  - cloudflare
  - video
  - realtime
  - sfu
# Remove at the first pub.dev release (roadmap M8). Until then a mistaken
# `dart pub publish` stops here.
publish_to: none

# The platforms the package supports and has been verified on (README,
# "Platforms"). The plugin has native code on Android and iOS only; macOS,
# Windows and the web run the Dart code on flutter_webrtc.
platforms:
  android:
  ios:
  macos:
  web:
  windows:

environment:
  # Flutter 3.41 (Dart 3.11) is the oldest SDK the code builds with: it uses
  # `TickerMode.valuesOf`, new in Flutter 3.41 (the `TickerMode.of` it
  # replaces is deprecated). Checked with `flutter pub get` and
  # `flutter pub downgrade`, then `flutter analyze` and `flutter test`, on
  # Flutter 3.41.0, and an Android build with its app template
  # (docs/api-review.md).
  sdk: ^3.11.0
  flutter: ">=3.41.0"

dependencies:
  flutter:
    sdk: flutter
  clock: ^1.1.1
  collection: ^1.19.0
  # The web audio sink reads the JS track behind flutter_webrtc's web track.
  dart_webrtc: ^1.8.0
  flutter_webrtc: ^1.6.2
  http: ^1.6.0
  web: ^1.1.0

dev_dependencies:
  fake_async: ^1.3.3
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  # Native code on phones: call audio routing (docs/design.md §4.6) and
  # screen share (§10). Other platforms use the Dart code only.
  plugin:
    platforms:
      android:
        package: dev.kammcs.cloudflare_realtime
        pluginClass: CloudflareRealtimePlugin
      ios:
        pluginClass: CloudflareRealtimePlugin
