name: cloudflare_realtime
description: "Unofficial Flutter client for the Cloudflare Realtime SFU: rooms, simulcast, screen share and data channels, built on flutter_webrtc."
version: 0.0.1
repository: https://github.com/kammcs/flutter-cloudflare-realtime
issue_tracker: https://github.com/kammcs/flutter-cloudflare-realtime/issues
topics:
  - webrtc
  - cloudflare
  - video
  - realtime
  - sfu
# Remove at the first pub.dev release (roadmap M8).
publish_to: none

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  clock: ^1.1.1
  collection: ^1.19.0
  # The web audio sink reads the JS track behind flutter_webrtc's web track.
  dart_webrtc: ^1.8.0
  flutter_webrtc: ^1.6.2
  http: ^1.6.0
  web: ^1.1.0

dev_dependencies:
  fake_async: ^1.3.3
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  # Native code for call audio routing on phones (docs/design.md §4.6).
  # Other platforms use the Dart code only.
  plugin:
    platforms:
      android:
        package: dev.kammcs.cloudflare_realtime
        pluginClass: CloudflareRealtimePlugin
      ios:
        pluginClass: CloudflareRealtimePlugin
